# ports.conf — dokumentasi port sharing v2 (dibaca manusia; perubahan via asv2 change-port)
# 443 ALL-IN-ONE: XTLS-VISION + VMESS/VLESS/TROJAN WS TLS + SSH-WS HTTPS (fallback nginx 8443)
TLS_443=443
# 80 MULTI: nginx -> ssh-ws http, vmess/vless/trojan WS NTLS
HTTP_80=80
SSH=22
DROPBEAR=109,143
SSH_WS_HTTP=2052
SQUID=3128
OVPN_TCP=1194
OVPN_UDP=2200
SLOWDNS=5300
L2TP=1701
XRAY_API=10085
